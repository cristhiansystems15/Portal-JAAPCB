<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Inventario</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top"><div><h1>📦 Inventario</h1><p>Control sencillo de productos</p></div><button id="scanBtn" class="primary">📷 Escanear</button></header>
<main>
<section class="stats"><div><span>Productos</span><b id="totalProducts">0</b></div><div><span>Unidades</span><b id="totalStock">0</b></div><div><span>Stock bajo</span><b id="lowStock">0</b></div></section>
<section class="toolbar"><input id="search" placeholder="🔎 Buscar por nombre o código..." autocomplete="off"><button id="newBtn">＋ Nuevo</button></section>
<section id="list" class="list"></section>
</main>
<div id="modal" class="modal hidden"><div class="sheet"><button id="closeModal" class="close">×</button><h2 id="modalTitle">Producto</h2><label>Código de barras<input id="barcode" inputmode="numeric"></label><label>Nombre<input id="name"></label><label>Categoría<input id="category"></label><label>Precio (L)<input id="price" type="number" min="0" step="0.01"></label><label>Existencia<input id="stock" type="number" min="0" step="1"></label><label>Stock mínimo<input id="minStock" type="number" min="0" step="1" value="5"></label><div class="actions"><button id="saveBtn" class="primary">Guardar</button><button id="deleteBtn" class="danger hidden">Eliminar</button></div></div></div>
<div id="scanner" class="modal hidden"><div class="scannerBox"><button id="closeScanner" class="close">×</button><h2>Escanear código</h2><video id="video" playsinline></video><p id="scanMsg">Apunta la cámara al código de barras.</p><div class="manual"><input id="manualCode" inputmode="numeric" placeholder="O escribe el código"><button id="manualBtn">Buscar</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body></html>
